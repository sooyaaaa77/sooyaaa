# ============================================================
# 个人作品集 · Nginx 站点配置
# 使用方法见 docs/04-deployment.md
#   1. 复制到服务器：/etc/nginx/sites-available/mysite
#   2. 建立软链接：  sudo ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/
#   3. 检查并重载：  sudo nginx -t && sudo systemctl reload nginx
# 当前用公网 IP 访问，server_name 用 _ 兜底（同时兼容已备案后的域名）。
# 域名 sooyaaa.online 已完成实名，但大陆服务器对外提供网站服务还需 ICP 备案，
# 备案通过后可把 server_name 改为 sooyaaa.online www.sooyaaa.online。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 站点根目录（deploy.sh 会把文件解压到这里）
    root /var/www/mysite;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/mysite.access.log;
    error_log  /var/log/nginx/mysite.error.log warn;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip 压缩，减少传输体积
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源缓存 7 天
    location ~* \.(?:css|js|svg|jpg|jpeg|png|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 自定义 404 页面
    error_page 404 /404.html;

    # 主路由：只返回真实存在的文件，不做目录列表
    location / {
        try_files $uri $uri/ =404;
    }

    # 禁止访问 .git、.env 等隐藏文件（放行 ACME 验证目录）
    location ~ /\.(?!well-known) {
        deny all;
    }
}
