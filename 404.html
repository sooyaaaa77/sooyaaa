<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页面走丢了 · 404</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      document.documentElement.classList.add("js");
      try {
        if (localStorage.getItem("portfolio-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {
        /* 忽略 */
      }
    })();
  </script>
</head>
<body>
  <main class="section notfound" id="main">
    <div class="container">
      <p class="notfound__code" aria-hidden="true">404</p>
      <p class="kicker"><span class="kicker__num">404</span> 页面不存在</p>
      <h1 class="section-title">这个页面<em>走丢了</em>。</h1>
      <p class="section-lead">
        你要找的地址可能已经改名，或者从来没有存在过。<br />
        回到首页看看，或者直接发邮件给我。
      </p>
      <p class="notfound__actions">
        <a class="btn btn--primary" href="/">回到首页 <span aria-hidden="true">↗</span></a>
        <a class="link-arrow" href="mailto:Taing007@outlook.com">Taing007@outlook.com <span aria-hidden="true">↗</span></a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <p>© <span id="year">2026</span> 唐小伟 · 2024 级</p>
        <p><a href="/">回到首页 ↑</a></p>
      </div>
    </div>
  </footer>

  <script>
    var y = document.getElementById("year");
    if (y) y.textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
